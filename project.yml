name: JEarn
options:
  bundleIdPrefix: com.shoix
  deploymentTarget:
    iOS: "17.0"
packages:
  JEarnCore:
    path: Packages/JEarnCore
targets:
  JEarn:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: JEarnCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shoix.jearn
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: JEarn
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
