name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - "App/**"
      - "project.yml"
      - ".github/workflows/build-ios.yml"

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -euo pipefail
          xcodebuild -project JEarn.xcodeproj -scheme JEarn -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package ipa
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/JEarn.app Payload/
          zip -qry JEarn.ipa Payload

      - name: Report sizes
        run: |
          set -euo pipefail
          du -sh build/Build/Products/Release-iphoneos/JEarn.app
          du -sh JEarn.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: JEarn-ipa
          path: JEarn.ipa
          retention-days: 14
