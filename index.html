<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#161826" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JEarn" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="./launch-750x1334.png" />
    <style>html,body{background:#161826}</style>
    <title>JEarn</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // Safety net: if the app isn't on screen after 5 s, say which step is stuck and offer to reset the cached app files (data is kept).
      window.__stage = 'loading app code';
      setTimeout(function () {
        var a = document.getElementById('app');
        if (!a || a.querySelector('.tabbar, .fatal')) return;
        a.innerHTML = '<div style="padding:60px 20px;color:#e6e7ee;font:15px/1.4 -apple-system,system-ui,sans-serif">'
          + '<p>JEarn is stuck ' + window.__stage + '. Your data is safe.</p>'
          + '<p>Tap below, then fully close JEarn and open it again.</p>'
          + '<button id="reset-files" style="font:inherit;padding:12px 16px;border:0;border-radius:10px;background:#3a3f5c;color:#fff">Reset app files</button></div>';
        document.getElementById('reset-files').onclick = function () {
          var sw = navigator.serviceWorker, c = window.caches;
          Promise.all([
            sw ? sw.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0,
            c ? c.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return c.delete(k); })); }) : 0,
          ]).catch(function () {}).then(function () { location.reload(); });
        };
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
